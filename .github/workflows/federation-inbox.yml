name: Federação — Processar Inbox

on:
  push:
    branches: [main]
    paths:
      - "federation/inbox/*.json"

permissions:
  contents: write

concurrency:
  group: federation-inbox
  cancel-in-progress: false

jobs:
  processar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - name: Processar probes novos
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in federation/inbox/*.json; do
            out="federation/outbox/$(basename "$f")"
            if [ ! -e "$out" ]; then
              node src/federation/process-inbox.mjs "$f"
            fi
          done
      - name: Publicar resultados
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- federation/outbox; then
            echo "Sem novo resultado."
            exit 0
          fi
          git config user.name "arca-machine-bridge"
          git config user.email "arca-machine-bridge@users.noreply.github.com"
          git add federation/outbox
          git commit -m "chore(federation): publicar resultado do Operador B"
          git push
