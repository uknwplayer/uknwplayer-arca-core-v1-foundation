name: Mega Brain Federação Mesh — Operador B

on:
  push:
    branches:
      - feat/mega-brain-federation-dispatch-v0.1
    paths:
      - 'federation/mesh-inbox/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mega-brain-federation-mesh-b
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - name: Processar Mega Brain statement assinado
        env:
          ARCA_FEDERATION_B_PRIVATE_KEY_PEM: ${{ secrets.ARCA_FEDERATION_B_PRIVATE_KEY_PEM }}
          ARCA_FEDERATION_REQUIRE_SIGNED_RESULT: '1'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in federation/mesh-inbox/*.json; do
            out="federation/outbox/$(basename "$f")"
            [ -e "$out" ] && continue
            node src/federation/process-mesh-inbox.mjs "$f" || continue
          done
      - name: Persistir evidência assinada do Operador B
        shell: bash
        run: |
          set -euo pipefail
          git add federation/outbox
          git diff --cached --quiet && exit 0
          git config user.name "arca-federation-operator-b"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "federation: persist Mega Brain signed result"
          git push
